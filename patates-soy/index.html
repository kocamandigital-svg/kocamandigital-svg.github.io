<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Patates Soy</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: oyunbaz mutfak tezgahı, gece
   IDEA: karanlık tezgahta spot altında tek sebze, röntgen eller
   PICTURE: 3D sebze + metal bıçak/soyacak, renkli iskelet eller
   COLOUR and TYPE: simsiyah, patates sarısı #f2d98a, turuncu vurgu #ff8a1f; Baloo 2
   LAYOUT: HUD üstte ortada, derinlik çubuğu sağda, kamera sol altta */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#f6efe0;font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c,#xr{position:fixed;inset:0;width:100%;height:100%;display:block}
#xr{z-index:4;pointer-events:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));background:rgba(0,0,0,.8);z-index:10;text-align:center;overflow-y:auto}
.hide{display:none!important}
h1{font-size:clamp(40px,11vw,64px);line-height:1;font-weight:800;color:#f2d98a}
h1 span{color:#ff8a1f}
.sub{font-size:16px;opacity:.8;max-width:440px;line-height:1.35}
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(460px,100%)}
.it{background:#141414;border:2px solid #2a2a2a;border-radius:16px;padding:10px 4px 8px;cursor:pointer;color:#f6efe0;font:inherit;font-size:15px;font-weight:700}
.it.on{border-color:#ff8a1f;background:#22160a}
.it i{display:block;width:40px;height:40px;margin:0 auto 4px;border-radius:50%}
.it small{display:block;font-size:12px;opacity:.65;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(460px,100%);background:#141414;border-radius:16px;padding:5px}
.seg button{min-height:48px;border:0;border-radius:12px;background:transparent;color:#f6efe0;font:inherit;font-size:15px;font-weight:700;cursor:pointer;line-height:1.1}
.seg button small{display:block;font-size:12px;font-weight:500;opacity:.7}
.seg button.on{background:#ff8a1f;color:#1a0d00}
.btn{min-height:52px;width:min(360px,100%);border:0;border-radius:16px;background:#ff8a1f;color:#1a0d00;font:inherit;font-size:19px;font-weight:800;cursor:pointer}
.btn.alt{background:#262626;color:#f6efe0}
.note{font-size:13px;opacity:.6;max-width:430px;line-height:1.3}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#time{font-size:44px;font-weight:800;line-height:1;color:#f2d98a;text-shadow:0 2px 12px #000}
#time.low{color:#ff4a3a}
.bars{display:flex;gap:12px;font-size:13px;font-weight:700}
.bar{width:110px}
.bar b{display:block;height:8px;border-radius:4px;background:#2a2a2a;overflow:hidden;margin-top:2px}
.bar b u{display:block;height:100%;width:0;background:#f2d98a;transition:width .15s}
#qb u{background:#6fd86a}
#depth{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:16px;height:180px;border-radius:8px;background:#1c1c1c;z-index:5;pointer-events:none;overflow:hidden}
#depth:before{content:'';position:absolute;inset:0;background:linear-gradient(#ff4a3a55 0 20%,#6fd86a4d 20% 77%,#ffffff12 77%)}
#depth i{position:absolute;left:-2px;right:-2px;height:6px;border-radius:3px;background:#fff;top:50%}
#dl{position:fixed;right:max(4px,env(safe-area-inset-right));top:calc(50% + 100px);font-size:12px;z-index:5;opacity:.7;width:40px;text-align:center;pointer-events:none}
#msg{position:fixed;left:50%;bottom:max(22%,120px);transform:translateX(-50%);z-index:6;font-size:21px;font-weight:800;text-align:center;pointer-events:none;text-shadow:0 2px 10px #000;max-width:92vw;line-height:1.15;transition:opacity .3s}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#f2d98a;z-index:6;pointer-events:none;text-shadow:0 4px 30px #000}
#cam{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));width:110px;height:82px;border-radius:12px;overflow:hidden;z-index:5;border:2px solid #333;background:#111;opacity:.8}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cur{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #f2d98a;border-radius:50%;z-index:7;pointer-events:none;left:-99px;top:-99px}
#cur.p{background:rgba(255,138,31,.55);border-color:#ff8a1f}
.res{background:#121212;border-radius:20px;padding:18px 20px;width:min(380px,100%);display:grid;gap:6px;font-size:17px}
.res div{display:flex;justify-content:space-between;gap:10px}
.res b{font-variant-numeric:tabular-nums}
#score{font-size:58px;font-weight:800;line-height:1;color:#f2d98a}
#grade{font-size:24px;font-weight:800;color:#ff8a1f}
#stars{font-size:38px;letter-spacing:6px;color:#ffc83a;line-height:1}
#coin{font-size:18px;font-weight:800;color:#ffc83a}
.shop{display:grid;gap:10px;width:min(460px,100%)}
.card{background:#141414;border:2px solid #2a2a2a;border-radius:16px;padding:12px 14px;text-align:left;display:grid;gap:6px}
.card.on{border-color:#6fd86a}
.card h3{font-size:19px;line-height:1.1;display:flex;justify-content:space-between;gap:8px}
.card h3 em{font-style:normal;font-size:14px;color:#6fd86a}
.card p{font-size:14px;opacity:.75;line-height:1.3}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card button{flex:1 1 120px;min-height:44px;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;background:#ff8a1f;color:#1a0d00}
.card button.alt{background:#262626;color:#f6efe0}
.card button:disabled{opacity:.4}
#shopMsg{font-size:14px;color:#ffc83a;min-height:20px;max-width:440px}
#quit{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:8;width:44px;height:44px;border-radius:12px;border:0;background:#1d1d1d;color:#f6efe0;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="xr"></canvas>
<div id="hud" class="hide">
  <div id="time">60</div>
  <div class="bars">
    <div class="bar">Soyulan <span id="cv">0%</span><b id="cb"><u></u></b></div>
    <div class="bar">Düzgünlük <span id="qv">100%</span><b id="qb"><u></u></b></div>
  </div>
</div>
<div id="depth" class="hide"><i></i></div><div id="dl" class="hide">derinlik</div>
<div id="msg"></div>
<div id="big" class="hide"></div>
<div id="cam" class="hide"><video id="vid" playsinline muted autoplay></video><canvas id="hc" width="160" height="120"></canvas></div>
<div id="cur"></div>
<button id="quit" class="hide" aria-label="Menü">✕</button>

<div id="menu" class="ov">
  <h1>Patates <span>Soy</span></h1>
  <p class="sub">Kamera iki elini de görür. Bıçağı ya da soyacağı kavra, süre bitmeden sebzeyi soy. Temiz ve eşit soyarsan puan yağar.</p>
  <div class="items" id="items"></div>
  <div class="seg" id="rot">
    <button data-r="auto" class="on">Otomatik dönüş<small>tek el, sebze kendi döner</small></button>
    <button data-r="manual">Elle çevir<small>sol el tutar, sağ el soyar</small></button>
  </div>
  <button class="btn" id="bCam">Kamerayla oyna</button>
  <button class="btn alt" id="bTouch">Dokunarak oyna</button>
  <button class="btn alt" id="bShop">Alet dükkanı · <span class="cv2"></span> altın</button>
  <p class="note" id="note"></p>
</div>

<div id="shop" class="ov hide">
  <h1 style="font-size:40px">Alet <span>dükkanı</span></h1>
  <div id="coin"></div>
  <div class="shop" id="shopList"></div>
  <div id="shopMsg"></div>
  <button class="btn alt" id="bShopBack">Geri</button>
</div>

<div id="result" class="ov hide">
  <div id="stars">★★★</div>
  <div id="grade">Usta Şef</div>
  <div id="score">0</div>
  <div class="res">
    <div>Soyulan yüzey <b id="rC">0%</b></div>
    <div>Düzgünlük <b id="rQ">0%</b></div>
    <div>Derin kesik <b id="rG">0</b></div>
    <div>Süre bonusu <b id="rT">0</b></div>
    <div>Rekor (<span id="rN"></span>) <b id="rB">0</b></div>
    <div>Kazanılan altın <b id="rA">0</b></div>
  </div>
  <button class="btn" id="bAgain">Tekrar</button>
  <button class="btn alt" id="bNext">Sonraki sebze</button>
  <button class="btn alt" id="bMenu">Menü</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const MP_URL='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MP_MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- Sebzeler ----------
const ITEMS=[
 {id:'patates',ad:'Patates',sure:60,skin:'#8a5a2c',skin2:'#6a411d',skin3:'#a87645',flesh:'#f3dc93',flesh2:'#e9cb72',gouge:'#c99a3e',lay:true,kind:'potato',mult:1,rough:.85,cc:0},
 {id:'elma',ad:'Elma',sure:50,skin:'#b2172a',skin2:'#e8b03a',skin3:'#7a0d18',flesh:'#f8f0d2',flesh2:'#efe2b4',gouge:'#d7bd7a',lay:false,kind:'apple',mult:1.1,rough:.32,cc:.5},
 {id:'havuc',ad:'Havuç',sure:45,skin:'#e3680f',skin2:'#b84e08',skin3:'#f08a2a',flesh:'#f9ab48',flesh2:'#f39532',gouge:'#c46a1a',lay:true,kind:'carrot',mult:1.15,rough:.6,cc:0},
 {id:'salatalik',ad:'Salatalık',sure:45,skin:'#2a5a1b',skin2:'#78aa45',skin3:'#183d0f',flesh:'#d8eeac',flesh2:'#c3e08c',gouge:'#9cbd5e',lay:true,kind:'cucumber',mult:1.2,rough:.45,cc:.25}
];
let itemIdx=0,rotMode='auto';
$('items').innerHTML=ITEMS.map((it,i)=>`<button class="it${i?'':' on'}" data-i="${i}"><i style="background:radial-gradient(circle at 35% 30%,${it.flesh},${it.skin} 45%,${it.skin3})"></i>${it.ad}<small>${it.sure} sn</small></button>`).join('');
$('items').onclick=e=>{const b=e.target.closest('.it');if(!b)return;itemIdx=+b.dataset.i;document.querySelectorAll('.it').forEach(x=>x.classList.toggle('on',x===b));};
const NOTES={auto:'Aletin üstünde yumruk yap: kavrarsın. Elini açarsan düşer. Elini geri çekersen bıçak kalkar, fazla yaklaştırırsan derin keser. Telefonu sabitle, elin 30–60 cm uzakta olsun.',
 manual:'Sol elinle sebzenin üstünde yumruk yap: sebzeyi tutarsın. Bileğini çevirince sebze de döner. Elini açıp geri çevir, tekrar tut. Sağ elinle bıçağı ya da soyacağı kavra ve soy. Dokunarak oynarken sebzenin dışından kaydırarak çevirirsin.'};
$('note').textContent=NOTES.auto;
$('rot').onclick=e=>{const b=e.target.closest('button');if(!b)return;rotMode=b.dataset.r;document.querySelectorAll('#rot button').forEach(x=>x.classList.toggle('on',x===b));$('note').textContent=NOTES[rotMode];};

// ---------- Three ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setClearColor(0x000000,1);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);camera.position.set(0,0,6);
// stüdyo ışığı yansımaları (softbox ortamı)
{
  const es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.BoxGeometry(20,20,20),new THREE.MeshBasicMaterial({color:0x0c0a08,side:THREE.BackSide})));
  const panel=(w,h,c,k,pos,look)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(...look);es.add(m);};
  panel(8,5,0xffffff,5,[0,9,3],[0,0,0]);panel(4,7,0xffe2bc,3,[-9,2,2],[0,0,0]);panel(4,6,0xcfe2ff,1.6,[9,1,-2],[0,0,0]);panel(10,2,0xffffff,1.2,[0,-2,9],[0,0,0]);
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,0.04).texture;pm.dispose();
}
const key=new THREE.DirectionalLight(0xfff3e2,1.5);key.position.set(2.5,4.5,5);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-3.5,right:3.5,top:3.5,bottom:-3.5,near:1,far:20});key.shadow.bias=-0.0006;key.shadow.radius=4;scene.add(key);
const rim=new THREE.DirectionalLight(0xffb878,0.9);rim.position.set(-4,1.5,-3);scene.add(rim);
const rim2=new THREE.DirectionalLight(0x9fc8ff,0.35);rim2.position.set(4,-1,-2);scene.add(rim2);

const TW=2048,TH=1024,AW=1024,AH=512,MW=128,MH=64;
const mkCv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const skinCv=mkCv(TW,TH),sctx=skinCv.getContext('2d');
const bumpCv=mkCv(AW,AH),bctx=bumpCv.getContext('2d');
const roughCv=mkCv(AW,AH),rctx=roughCv.getContext('2d');
const skinTex=new THREE.CanvasTexture(skinCv);skinTex.encoding=THREE.sRGBEncoding;skinTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
const bumpTex=new THREE.CanvasTexture(bumpCv),roughTex=new THREE.CanvasTexture(roughCv);
const mat=new THREE.MeshPhysicalMaterial({map:skinTex,bumpMap:bumpTex,bumpScale:0.035,roughnessMap:roughTex,roughness:1,metalness:0,envMapIntensity:0.9});
const outer=new THREE.Group(),pivot=new THREE.Group();outer.add(pivot);scene.add(outer);
let mesh=null,texDirty=false,texLast=0,fleshPat=null,gougePat=null;
let cellW=new Float32Array(MW*MH),cellS=new Uint8Array(MW*MH),cellStroke=new Int32Array(MW*MH),cellOver=new Int32Array(MW*MH);
let totalW=1,peelW=0,cleanW=0,gougeW=0,overW=0,gouges=0,itemR=1;

function dirToUV(x,y,z){const th=Math.acos(clamp(y,-1,1));let ph=Math.atan2(z,-x);if(ph<0)ph+=Math.PI*2;return[ph/(Math.PI*2),th/Math.PI]}
function makePattern(base,spk,dark,streak){const c=mkCv(256,256),x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){x.globalAlpha=rnd(.08,.3);x.fillStyle=Math.random()<.5?spk:'#fffbe8';x.beginPath();x.arc(rnd(0,256),rnd(0,256),rnd(.6,2.4),0,7);x.fill();}
  if(streak)for(let i=0;i<40;i++){x.globalAlpha=.18;x.strokeStyle=dark;x.lineWidth=rnd(1,3);x.beginPath();const y=rnd(0,256);x.moveTo(0,y);x.bezierCurveTo(80,y+rnd(-20,20),170,y+rnd(-20,20),256,y);x.stroke();}
  x.globalAlpha=1;return sctx.createPattern(c,'repeat');}

function buildItem(it){
  if(mesh){pivot.remove(mesh);mesh.geometry.dispose();}
  const WS=256,HS=160;
  const geo=new THREE.SphereGeometry(1,WS,HS);
  const p=geo.attributes.position,v=new THREE.Vector3();
  const eyes=[];for(let i=0;i<10;i++)eyes.push(new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize());
  const s1=rnd(0,6),s2=rnd(0,6),s3=rnd(0,6);
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i).normalize();const x=v.x,y=v.y,z=v.z;let r=1,sx=1,sy=1,sz=1;
    if(it.kind==='potato'){
      r+=0.075*Math.sin(2.6*x+s1)*Math.sin(2.1*y+s2)*Math.sin(3.0*z+s3)+0.04*Math.sin(5.5*x+s2)*Math.sin(4.7*z+s1)+0.022*Math.sin(9*y+2*x+s3)+0.008*Math.sin(23*x+17*y)*Math.sin(19*z);
      for(const e of eyes){const d=v.distanceTo(e);if(d<0.12)r-=0.03*(1-d/0.12)**2;}
      sx=0.98;sy=1.4;sz=0.9;
    }else if(it.kind==='apple'){
      const ay=Math.abs(y);r-=0.34*Math.pow(ay,10)+0.05*Math.pow(ay,3)*(y<0?1.4:1);r+=0.018*Math.sin(5*Math.atan2(z,x)+s1)*(1-ay);
      sx=sz=1.05+0.12*y;sy=0.92;
    }else if(it.kind==='carrot'){
      const t=(y+1)/2;const k=0.14+0.5*Math.pow(t,0.55);sx=sz=k;sy=2.05;r+=0.016*Math.max(0,Math.sin(46*y+s1))**6+0.01*Math.sin(3*Math.atan2(z,x)+y*4);
    }else{
      const k=0.6*(1-0.13*Math.pow(Math.abs(y),6));sx=sz=k*(1+0.05*Math.sin(y*3+s1));sy=1.95;
      r+=0.008*Math.sin(14*Math.atan2(z,x));
    }
    p.setXYZ(i,x*r*sx,y*r*sy,z*r*sz);
  }
  geo.computeVertexNormals();
  const n=geo.attributes.normal,RW=WS+1;
  for(let j=0;j<=HS;j++){const a=j*RW,b=j*RW+WS;const nx=(n.getX(a)+n.getX(b))/2,ny=(n.getY(a)+n.getY(b))/2,nz=(n.getZ(a)+n.getZ(b))/2;n.setXYZ(a,nx,ny,nz);n.setXYZ(b,nx,ny,nz);}
  cellW.fill(0);const idx=geo.index.array,uv=geo.attributes.uv;const A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3(),E1=new THREE.Vector3(),E2=new THREE.Vector3();
  for(let t=0;t<idx.length;t+=3){const ia=idx[t],ib=idx[t+1],ic=idx[t+2];A.fromBufferAttribute(p,ia);B.fromBufferAttribute(p,ib);C.fromBufferAttribute(p,ic);
    const area=E1.subVectors(B,A).cross(E2.subVectors(C,A)).length()/2;const u=(uv.getX(ia)+uv.getX(ib)+uv.getX(ic))/3,vv=(uv.getY(ia)+uv.getY(ib)+uv.getY(ic))/3;
    cellW[Math.min(MH-1,Math.floor((1-vv)*MH))*MW+Math.min(MW-1,Math.floor(u*MW))]+=area;}
  totalW=0;for(let i=0;i<cellW.length;i++)totalW+=cellW[i];
  cellS.fill(0);cellStroke.fill(-1);cellOver.fill(-1);peelW=cleanW=gougeW=overW=0;gouges=0;
  geo.computeBoundingSphere();itemR=geo.boundingSphere.radius;
  paintSkin(it,eyes);
  fleshPat=makePattern(it.flesh,it.flesh2,it.gouge,it.kind==='carrot');gougePat=makePattern(it.gouge,it.flesh2,'#000',true);
  mat.clearcoat=it.cc;mat.clearcoatRoughness=.35;mat.needsUpdate=true;
  mesh=new THREE.Mesh(geo,mat);mesh.castShadow=true;mesh.receiveShadow=true;pivot.add(mesh);
  pivot.rotation.set(0,0,it.lay?Math.PI/2:0);
  const sm=(c,r)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
  if(it.kind==='apple'){const st=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.04,0.38,10),sm(0x4a2e14,.8));st.position.y=0.78;st.rotation.z=0.25;mesh.add(st);
    const lf=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,8),sm(0x3f8f2a,.5));lf.scale.set(1,0.15,0.5);lf.position.set(0.14,0.86,0);lf.rotation.z=-0.4;mesh.add(lf);}
  if(it.kind==='carrot'){const g=sm(0x3f8f2a,.6);for(let i=0;i<7;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(0.05,rnd(.6,.9),6),g);l.position.y=2.3;l.rotation.set(rnd(-.6,.6),0,rnd(-.6,.6));mesh.add(l);}}

function drawHand(S,dt,dpr,tint,dim){

  FING.forEach((f,i)=>{const ch=i===0?f:[0,...f];for(let j=1;j<ch.length;j++)bone(ch[j-1],ch[j],FCOL[i]);});

async function startCamera(){

  const free=`<div class="card${equip?'':' on'}"><h3>Mutfak Bıçağı<em>ücretsiz</em></h3><p>Standart bıçak, her zaman masada. Dar ağız, ×1.2 puan.</p><div class="row"><button class="alt" data-eq="">${equip?'Sadece bıçak':'Kullanılıyor'}</button></div></div>`;
  $('shopList').innerHTML=free+SHOP.map(x=>{const u=x.obj.userData,own=owned[x.id],on=own&&equip===x.id;
    return `<div class="card${on?' on':''}"><h3>${u.name}<em>${own?'senin':x.price+' altın'}</em></h3><p>${x.desc}</p><div class="row">${own?`<button class="alt" data-eq="${x.id}">${on?'Kullanılıyor':'Masaya koy'}</button>`:`<button data-buy="${x.id}" ${coins<x.price?'disabled':''}>${x.price} altınla al</button><button class="alt" data-tl="${x.id}">${x.tl}</button>`}</div></div>`;}).join('');
  coinUI();
}
function buyTool(id){const x=SHOP.find(s=>s.id===id);if(!x||owned[id]||coins<x.price)return false;coins-=x.price;owned[id]=true;equip=id;saveShop();placeRest();renderShop();$('shopMsg').textContent=x.obj.userData.name+' senin! Masaya koydum.';tone(880,.12,'sine',.2);return true;}
$('shopList').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.buy)buyTool(b.dataset.buy);
  else if(b.dataset.eq!==undefined){equip=b.dataset.eq||null;saveShop();placeRest();renderShop();$('shopMsg').textContent='';}
  else if(b.dataset.tl)$('shopMsg').textContent='Gerçek parayla satın alma, oyunun App Store / Google Play sürümünde açılacak. Şimdilik oynayarak altın kazan.';};
$('bShop').onclick=()=>{show('menu',false);show('shop',true);$('shopMsg').textContent='';renderShop();};
$('bShopBack').onclick=()=>{show('shop',false);show('menu',true);coinUI();};
coinUI();

// ---------- Döngü ----------
let tPrev=performance.now(),tAll=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;tAll+=dt;
  if(mode==='cam'){pollHand();for(const S of[K,Bh])if(now-S.lastSeen>600)S.seen=false;}
  const it=ITEMS[itemIdx];
  if(mesh){
    if(rotMode==='auto'){mesh.rotation.y+=dt*(state==='play'?0.75:0.35);
      if(it.lay)outer.rotation.set(Math.sin(tAll*.5)*.35,Math.sin(tAll*.37)*.45,0);else outer.rotation.set(Math.sin(tAll*.45)*.5,0,Math.sin(tAll*.3)*.12);}
    else if(state==='pick'&&!holding&&mode==='cam')mesh.rotation.y+=dt*0.25;
  }
  const cur=$('cur');
  if(mode==='touch'&&inp.seen&&state!=='menu'&&state!=='result'){cur.style.left=inp.x+'px';cur.style.top=inp.y+'px';cur.classList.toggle('p',inp.down);cur.style.opacity=held?.35:1;}else cur.style.left='-99px';
  if(mode==='cam'){holderCtl(dt);camTools(dt,it,now);}else touchTools(dt,it);
  cutAmt*=.85;if(scrape){scrape.g.gain.value=cutAmt*.22;scrape.f.frequency.value=2600+cutAmt*1500;}
  if(texDirty&&now-texLast>40){texDirty=false;texLast=now;skinTex.needsUpdate=bumpTex.needsUpdate=roughTex.needsUpdate=true;}
  if(mode==='cam'){const dv=held&&K.palmRef?K.depth:1;const y=clamp(0.6-(dv-1)*1.15,0,.96);$('depth').firstChild.style.top=(y*100)+'%';$('depth').firstChild.style.background=dv>1.35?'#ff4a3a':dv<.85?'#9a9a9a':'#fff';}
  drawXray(dt);
  for(const m of parts){if(!m.visible)continue;const u=m.userData;u.life-=dt;if(u.life<=0){m.visible=false;continue;}u.v.y-=4.5*dt;m.position.addScaledVector(u.v,dt);m.rotation.x+=u.w.x*dt;m.rotation.y+=u.w.y*dt;m.rotation.z+=u.w.z*dt;}
  if(state==='count'){const prev=Math.ceil(countT);countT-=dt;const c=Math.ceil(countT);$('big').textContent=c>0?c:'Soy!';if(c!==prev&&c>0)tone(440,.1,'sine',.15);
    if(countT<=-0.5){show('big',false);state='play';tone(880,.15,'sine',.2);if(rotMode==='manual'&&mode==='cam')msg('Sol elinle sebzeyi tut ve çevir','#6fd86a',2);}}
  else if(state==='play'){timeLeft-=dt;const c=Math.ceil(timeLeft);if(timeLeft<5.5&&c!==tickLast){tickLast=c;tone(1000,.05,'square',.08);}
    if(peelW/totalW>=.97){msg('Tertemiz!','#6fd86a',1.5);finish();}else if(timeLeft<=0){timeLeft=0;msg('Süre bitti!','#ff8a1f',1.5);finish();}
    updHud();}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;}
  renderer.render(scene,camera);
}
resize();buildItem(ITEMS[0]);requestAnimationFrame(loop);

window.__sim={get state(){return state},get cov(){return peelW/totalW},get q(){return qual()},get held(){return held&&held.userData.name},get gouges(){return gouges},get time(){return timeLeft},
  get holding(){return holding},get quat(){return outer.quaternion.toArray().map(v=>+v.toFixed(3))},
  screenOf:n=>toolCenterScreen(n==='knife'?knife:equipped()||peeler),get coins(){return coins},buy:id=>buyTool(id),center:()=>toScreen(new THREE.Vector3()),
  finish:()=>{timeLeft=0.01;},tip:()=>tipScr,setMode:m=>{mode=m;show('depth',m==='cam');show('dl',m==='cam');},setRot:r=>{rotMode=r;},dbg:()=>({K:[K.seen,K.grip,K.label,Math.round(K.cx),Math.round(K.cy)],B:[Bh.seen,Bh.grip,Bh.label,Math.round(Bh.cx),Math.round(Bh.cy)],held:held&&held.userData.name})};
}
</script>
